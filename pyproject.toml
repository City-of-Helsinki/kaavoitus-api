[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''

[tool.poetry]
name = "Kaavoitus-API"
version = "0.1.0"
description = "Kaavoitus API"

authors = [
    "Helsingin Kaupunki"
]

readme = ["README", "LICENSE"]

[tool.poetry.dependencies]
python = ">=3.12,<=3.14"
django = "5.2.17"
django-environ = "0.14.0"
djangorestframework = "3.16.1"
django-extensions = "4.1"
drf_spectacular = "0.30.0"
owslib = "0.36.0"
lxml = "6.1.2"
pydov = "4.0.0"
psycopg2 = "2.9.12"
oracledb = "4.0.2"
gunicorn = "26.1.0"
numpy = "2.5.2"
geojson = "3.3.0"
sentry-sdk = "2.68.0"
django-redis = "7.0.0"
openpyxl = "3.1.5"
pyproj = "3.7.2"
shapely = "2.1.2"

[tool.poetry.group.dev.dependencies]
black = "22.12.0"
flake8 = "5.0.4"
flake8-print = "5.0.0"
pytest = "7.2.1"
pytest-cov = "4.0.0"
pytest-django = "4.5.2"